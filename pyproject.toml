[project]
name = "reconhecimento-facial"
version = "0.1.0"
description = "Deteccao e reconhecimento facial - projeto de estudo"
requires-python = ">=3.11"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --strict-markers"
filterwarnings = [
    # face_recognition_models usa pkg_resources, removido do setuptools
    # moderno. O aviso e da dependencia, nao do nosso codigo.
    "ignore:pkg_resources is deprecated:UserWarning",
]
